# Configuration PythonTeX pour arithmétique exacte
# Ce fichier configure le moteur PythonTeX pour utiliser l'arithmétique exacte
# Placez ce fichier dans le même dossier que votre fichier .tex

# Activer l'arithmétique entière exacte (pas de float64)
integer_arithmetic = true

# Conserver les fractions sous forme exacte (Rational)
default_rational = str

# Activer SymPy pour les calculs symboliques exacts
sympy = true

# Configuration décimale de précision maximale
decimal = true
decimal_precision = 100

# Empêcher la conversion automatique en float64
disable_float_conversion = true

# Mode strict : toute erreur Python arrête la compilation
strict_mode = true